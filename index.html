<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiendas Urbano - Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Paleta del diseño original: azul marino + rosa suave */
:root{--navy:#1b3a8c;--blue:#2457d6;--pink:#fbe3ec;--pink-strong:#e8457a;--bg:#fcf8fb;--text:#1c2238;--muted:#6b7280;--line:#ece6ee;--ok:#16a34a;--err:#dc2626;--sans:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--script:'Dancing Script',cursive}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
h1,h2,h3,h4{margin:0 0 8px}
h1,h2,h3{font-weight:700;letter-spacing:-.01em;color:var(--navy)}
svg.i{width:22px;height:22px;display:block;flex:0 0 auto}
.wrap{max-width:1360px;margin:0 auto;padding:0 16px;width:100%}
.topbar{background:var(--navy);color:#fff;font-size:13px;text-align:center;padding:7px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.topbar svg.i{width:16px;height:16px}
header.main{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hdr{display:flex;align-items:center;gap:20px;height:72px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;line-height:.95;color:var(--navy);font-size:21px;white-space:nowrap}
.logo b{color:var(--blue)}
.logo svg.i{width:34px;height:34px;color:var(--blue)}
.search{flex:1;max-width:520px;position:relative;margin:0}
.search input{width:100%;padding:11px 16px 11px 42px;border:1px solid var(--line);border-radius:999px;background:#f3f4f8;outline:none}
.search svg.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
nav.menu{display:flex;gap:22px;margin-left:auto}
nav.menu a,.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--navy);position:relative;padding:4px 0}
nav.menu a.on{color:var(--blue);font-weight:600}
nav.menu a.on::after{content:"";position:absolute;bottom:-4px;left:0;right:0;height:3px;background:var(--blue);border-radius:3px}
.badge{position:absolute;top:-4px;right:-10px;background:var(--pink-strong);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bottomnav{display:none}
#app{flex:1;display:flex;flex-direction:column;min-height:100vh}
.page{padding:18px 16px 40px;flex:1;width:100%}
.crumbs{font-size:13px;color:var(--muted);margin:0 0 10px}
.crumbs a{color:var(--navy)}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:12px 20px;font-weight:600;text-decoration:none}
.btn:hover{background:#0a1f5a}
.btn:disabled{background:#9aa3b8;cursor:not-allowed}
.btn svg.i{width:18px;height:18px}
.btn.sm{padding:9px 12px;font-size:14px;width:100%}
.btn.full{width:100%}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--err);font-size:13px;margin:0}
.empty{text-align:center;padding:50px 10px;background:#fff;border-radius:14px}
.empty p{margin:0 0 14px}
/* Inicio */
.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.trust div{background:#fff;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.trust svg.i{color:var(--blue)}
.trust b{display:block;font-size:13px}
/* Portada en tres columnas, como el diseño original */
.home{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);align-items:start}
.home-main{min-width:0;order:-1}
.home-left,.home-side{display:grid;gap:16px;align-content:start;min-width:0;grid-template-columns:minmax(0,1fr)}
.side-cats{display:none;background:#fff;border-radius:18px;padding:12px;box-shadow:0 2px 10px rgba(27,58,140,.06)}
.side-cats h3{display:flex;align-items:center;gap:10px;font-size:18px;background:var(--pink);margin:0 0 6px;padding:12px;border-radius:12px}
.side-cats h3 svg.i{width:20px;height:20px}
.catlist a{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;color:var(--text);font-size:14px;font-weight:500}
.catlist a:hover{background:#f7f2f8;color:var(--blue)}
.catlist img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:center 20%;background:#eee}
.catlist .chev{margin-left:auto;color:var(--muted)}
.catlist a.oferta{background:var(--pink);color:var(--pink-strong);font-weight:700;margin-top:6px}
.catlist .pct-dot{width:30px;height:30px;border-radius:50%;background:var(--pink-strong);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.promo-card{position:relative;border-radius:18px;overflow:hidden;min-height:180px;display:flex;flex-direction:column;justify-content:center;padding:18px;background:#f3e9f5}
.promo-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.promo-card::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(243,233,245,.97) 35%,rgba(243,233,245,0) 75%)}
.promo-card > h3,.promo-card > .btn{position:relative;z-index:2}
.promo-card h3{font-size:22px;line-height:1.1;margin:0 0 12px;max-width:62%}
.promo-card .btn{align-self:flex-start;background:#fff;color:var(--navy);padding:9px 16px;font-size:14px}
.promo-card.bags{min-height:230px;justify-content:flex-start;background:#e9eefb}
.promo-card.bags::before{background:linear-gradient(180deg,rgba(233,238,251,.96) 28%,rgba(233,238,251,0) 62%)}
.promo-card.bags h3{font-family:var(--script);font-size:36px;font-weight:700;max-width:none;transform:rotate(-6deg);transform-origin:left;margin:8px 0 0 4px}
.ship-card{background:var(--navy);color:#fff;border-radius:18px;padding:20px;display:flex;align-items:center;gap:14px}
.ship-card svg.i{width:46px;height:46px}
.ship-card b{display:block;font-size:20px;line-height:1.15}
.ship-card span{font-size:14px;opacity:.85}
.news-card{background:var(--pink);border-radius:18px;padding:20px;color:var(--navy)}
.news-card svg.i{color:var(--navy)}
.news-card h3{font-size:20px;line-height:1.2;margin:8px 0 6px}
.news-card p{font-size:13px;margin:0 0 12px;color:var(--text)}
.news-card .nl{background:#fff;border-radius:999px;padding:4px;margin:0}
.news-card .nl input{padding:10px 12px}
.news-card .nl button{width:40px;height:40px;padding:0;border-radius:50%;flex:0 0 auto}
.social{background:#fff;border-radius:18px;padding:14px;display:flex;justify-content:center;gap:12px}
.social a{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center}
.social svg.i{width:20px;height:20px}
.hero{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(120deg,#fde8f0,#f8d4e2);min-height:330px;display:flex;align-items:center;padding:34px 40px}
.hero-img{position:absolute;right:0;top:0;height:100%;width:56%;object-fit:cover;object-position:center 22%;mix-blend-mode:multiply}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#fde8f0 36%,rgba(253,232,240,.55) 50%,rgba(253,232,240,0) 64%)}
.hero-txt{position:relative;z-index:2;max-width:60%}
.hero .doodle svg.i{width:30px;height:30px;color:var(--pink-strong);margin-bottom:4px}
.hero h1{font-size:40px;line-height:1.05;font-weight:800;white-space:nowrap}
.hero p{font-size:22px;margin:4px 0 22px;color:var(--navy);font-weight:500}
.hero p::after{content:"";display:block;width:96px;height:4px;border-radius:4px;background:var(--pink-strong);opacity:.7;margin:8px 0 0 70px}
.sec-h h2{display:flex;align-items:center;gap:8px}
.sec-h h2 .star{color:#f5b301;fill:#f5b301}
.sec-h h2 .tagi{color:var(--pink-strong)}
.dots{display:flex;gap:6px;margin-top:14px;align-items:center}
.dots button{width:9px;height:9px;border-radius:50%;border:0;background:#f1b5cc;padding:0}
.dots button.on{background:var(--blue)}
.arrows{margin-left:auto;display:flex;gap:6px}
.arrows button{width:32px;height:32px;border-radius:50%;border:0;background:#fff;color:var(--navy);font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.circles{display:flex;gap:12px;overflow-x:auto;padding:8px 2px;scrollbar-width:none}
.circles::-webkit-scrollbar{display:none}
.circ{flex:0 0 auto;text-align:center;font-size:13px;width:92px;color:var(--text)}
.cimg{display:block;width:80px;height:80px;margin:0 auto 6px;border-radius:50%;overflow:hidden;position:relative;background:#eee}
.cimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 15%}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 14px}
.sec-h h2{font-size:22px;margin:0}
.sec-h a{color:var(--blue);font-weight:600;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pcard{position:relative;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(27,58,140,.07);display:flex;flex-direction:column}
.pimg{aspect-ratio:4/5;position:relative;overflow:hidden;display:block}
.pimg img,.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center}
.thumb{width:84px;height:110px;border-radius:10px;flex:0 0 auto;position:relative;overflow:hidden}
.tag{position:absolute;z-index:2;top:10px;left:10px;background:var(--pink-strong);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}
.heart{position:absolute;z-index:2;top:8px;right:8px;background:#fff;border:0;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--pink-strong);padding:0}
.heart svg{width:18px;height:18px}
.heart.on svg{fill:var(--pink-strong)}
.pinfo{padding:12px;display:flex;flex-direction:column;flex:1}
.brand{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
/* Nombre siempre en 2 líneas de alto: así precios y botones quedan alineados entre tarjetas */
.pinfo h4{margin:2px 0 6px;font-size:14px;line-height:1.25;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pinfo .prices{min-height:22px;margin-bottom:10px}
.pinfo h4 a:hover{color:var(--blue)}
.prices b{color:var(--blue);font-size:16px}
.prices s{color:var(--muted);font-size:13px;margin-left:6px}
.prices .pct{color:var(--pink-strong);font-size:12px;font-weight:700;margin-right:4px}
.pinfo .btn{margin-top:auto}
.promos{display:grid;gap:14px;margin-top:20px}
.promo{border-radius:16px;padding:20px;color:var(--navy)}
.promo.navy{background:var(--navy);color:#fff}
.promo.pink{background:var(--pink)}
.nl{display:flex;gap:8px;margin-top:10px}
.nl input{flex:1;padding:12px 14px;border:0;border-radius:999px;min-width:0}
.nl button{border:0;background:var(--navy);color:#fff;border-radius:999px;padding:0 16px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.chip{white-space:nowrap;padding:8px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;color:var(--navy)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.filtros{display:flex;flex-wrap:wrap;gap:10px;background:#fff;border-radius:14px;padding:12px;margin-bottom:14px;align-items:end}
.filtros label{font-size:12px;color:var(--muted);font-weight:600;display:grid;gap:4px;flex:1 1 150px}
.filtros select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
footer.foot{background:var(--navy);color:#fff;padding:26px 16px 22px;font-size:13px;margin-top:20px}
.foot-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.foot-grid h4{font-size:14px;margin-bottom:8px}
.foot-grid a{display:block;color:#dfe6ff;padding:3px 0}
.foot-grid a:hover{text-decoration:underline}
.foot-bottom{max-width:1200px;margin:18px auto 0;border-top:1px solid rgba(255,255,255,.14);padding-top:12px;text-align:center;color:#c9d3f5;font-size:12px}
/* Ficha de producto */
.pdp{display:grid;gap:22px}
.pdp-img{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:4/5;background:#eee}
.pdp-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pdp-info h1{font-size:24px;margin-top:4px}
.pdp-info .price-big{font-size:26px;font-weight:800;color:var(--blue);margin:10px 0 4px}
.pdp-info .price-big s{font-size:16px;color:var(--muted);font-weight:400;margin-left:8px}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.size{min-width:52px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;padding:0 12px}
.size.on{border-color:var(--navy);background:var(--navy);color:#fff}
.size:disabled{color:#b6bcc9;text-decoration:line-through;cursor:not-allowed;background:#f7f7f9}
.benefits{display:grid;gap:8px;margin:16px 0;font-size:14px}
.benefits div{display:flex;gap:10px;align-items:center}
.benefits svg.i{width:18px;height:18px;color:var(--blue)}
.qtyrow{display:flex;gap:12px;align-items:center;margin:14px 0}
.qty{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;background:#fff}
.qty button{border:0;background:none;font-size:18px;width:28px;height:28px}
.details{border-top:1px solid var(--line);margin-top:8px}
.details details{border-bottom:1px solid var(--line);padding:12px 0}
.details summary{cursor:pointer;font-weight:700;color:var(--navy)}
.details p{margin:8px 0 0;font-size:14px;line-height:1.5;color:#374151}
.rel-h{margin:28px 0 12px;font-size:20px}
/* Carrito / wishlist / checkout */
.cart-layout{display:grid;gap:16px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.qty-sm{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:2px 6px;margin-top:6px}
.qty-sm button{border:0;background:none;font-size:18px;width:26px}
.trash{border:0;background:none;color:var(--muted);padding:6px}
.trash svg{width:20px;height:20px}
.line{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.line.total{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.steps{display:flex;justify-content:space-between;max-width:560px;margin:0 auto 20px}
.st{text-align:center;font-size:12px;color:var(--muted);flex:1}
.dotn{display:inline-flex;width:28px;height:28px;border-radius:50%;background:#e5e7eb;align-items:center;justify-content:center;font-weight:700;margin-bottom:4px;color:#fff}
.st.done .dotn{background:var(--ok)}
.st.cur .dotn{background:var(--blue)}
.st.cur small{color:var(--blue);font-weight:600}
.narrow{max-width:560px;margin:0 auto}
.form{display:grid;gap:12px}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
label input:not([type=checkbox]){padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fafbff;min-width:0}
.pwd{display:flex;gap:6px;align-items:center}
.pwd input{flex:1}
.pwd button{border:0;background:none;color:var(--muted);padding:6px;display:flex}
.pwd button svg{width:20px;height:20px}
.radio{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-weight:600;font-size:15px}
.radio:has(input:checked){border-color:var(--blue);background:#f2f6ff}
.btnrow{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.ord{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
/* Auth */
.authbg{min-height:100vh;background:linear-gradient(#fde4ee,#fff 60%);display:flex;justify-content:center;align-items:flex-start;padding:30px 16px}
.auth{width:100%;max-width:380px;background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 24px rgba(15,44,122,.12);text-align:center}
.auth .form{text-align:left}
.avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:center 20%;display:block;margin:6px auto 12px;border:4px solid var(--pink)}
.auth .links{margin-top:14px;font-size:14px}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:600;padding:0}
.back{display:inline-flex;color:var(--navy)}
.back svg{width:24px;height:24px}
.okicon{color:var(--ok);margin:0 auto 8px}
.okicon svg{width:64px;height:64px}
/* Panel del dueño */
.dropzone{position:relative;display:grid;justify-items:center;gap:8px;border:2px dashed #b9c7ea;border-radius:14px;padding:14px;text-align:center;cursor:pointer;background:#f8faff;max-width:100%;transition:background .15s,border-color .15s}
.dropzone.over{border-color:var(--blue);background:#e6eeff}
.dropzone .prev{position:relative;width:200px;max-width:100%;aspect-ratio:4/5;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.dropzone .prev.wide{width:100%;aspect-ratio:16/7}
.dropzone .prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dropzone .dz-txt{font-size:13px;color:var(--blue);font-weight:600}
.dropzone .dz-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.tab{white-space:nowrap;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:600}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.arow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.arow:last-child{border-bottom:0}
.acts{display:flex;gap:6px}
.btn.sm2{padding:8px 12px;font-size:13px}
.foto-prev{width:100%;max-width:240px;aspect-ratio:4/5;border-radius:12px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:#eee}
.foto-prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bprev{max-width:100%}
/* Ayuda, contacto y otros detalles */
:focus-visible{outline:3px solid var(--pink-strong);outline-offset:2px;border-radius:6px}
.nofoto{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;font-weight:600}
.freebar{height:8px;border-radius:999px;background:#f1e6ee;overflow:hidden}
.freebar span{display:block;height:100%;background:linear-gradient(90deg,var(--pink-strong),var(--blue));border-radius:999px}
.info-layout{display:grid;gap:16px;align-items:start}
.info-menu{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.info-menu a{white-space:nowrap;padding:9px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;color:var(--navy)}
.info-menu a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.info p,.info li{line-height:1.6}
.info details{border-bottom:1px solid var(--line);padding:12px 0}
.info summary{cursor:pointer;font-weight:600;color:var(--navy)}
table.tallas{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
.tallas th,.tallas td{border-bottom:1px solid var(--line);padding:8px;text-align:center}
.tallas th{background:var(--pink);color:var(--navy)}
textarea{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fafbff;resize:vertical}

/* ===================== STOCK =====================
   Cada producto guarda cuántas unidades hay por talla: p.stock = {XS: 3, S: 0, ...}
   Los accesorios tienen talla única: p.stock = {Única: 5}. El dueño lo cambia en Panel → Inventario. */
const sizesOf = p => p.tipo === 'Accesorios' ? ['Única'] : SIZES;
const POCO = 3;      /* desde cuántas unidades se considera "poco stock" */
const MAXQ = 10;     /* máximo de unidades por producto y talla en un mismo carrito */
const ENVIO_GRATIS = 30000, COSTO_ENVIO = 3990;
/* Stock inicial de ejemplo, para que el prototipo tenga tallas agotadas y con pocas unidades */
function stockInicial(p){
  const st = {};
  sizesOf(p).forEach((s, i) => {
    if (s === 'Única') { st[s] = p.id % 6 === 0 ? 2 : 4 + (p.id % 9); return; }
    const agotada = ((p.id * 3 + i * 5) % 7) === 0;
    st[s] = agotada ? 0 : (p.id % 6 === 0 ? 1 + (i % 2) : 2 + ((p.id * 7 + i * 3) % 12));
  });
  return st;
}
/* Deja el stock de un producto ordenado según sus tallas (sirve para datos antiguos o si cambia de categoría) */
function prepararStock(p){
  const viejo = p.stock || {}, ini = stockInicial(p), nuevo = {};
  sizesOf(p).forEach(s => {
    const n = Number(viejo[s]);
    nuevo[s] = p.stock && Number.isFinite(n) ? Math.max(0, Math.floor(n)) : ini[s];
  });
  p.stock = nuevo;
  return p;
}
PRODUCTS.forEach(prepararStock);
const stockDe = (p, s) => (p && p.stock && p.stock[s]) || 0;
const stockTotal = p => sizesOf(p).reduce((a, s) => a + stockDe(p, s), 0);
const sizeOk = (p, s) => sizesOf(p).includes(s) && stockDe(p, s) > 0;
const enCarroDe = (id, s) => S.cart.filter(i => i.id === id && (!s || i.size === s)).reduce((a, i) => a + i.qty, 0);
/* Cuántas unidades más se pueden agregar de una talla (según stock y máximo por carrito) */
const maxAgregable = (p, s) => Math.max(0, Math.min(MAXQ, stockDe(p, s)) - enCarroDe(p.id, s));
/* Lo que ven las clientas: los productos ocultos por el dueño no aparecen */
const visibles = () => PRODUCTS.filter(p => !p.oculto);
/* Estado del stock para mostrar en el panel */
function estadoStock(p){
  const t = stockTotal(p);
  if (!t) return {cls: 'agotado', txt: 'Agotado'};
  if (t <= POCO || sizesOf(p).some(s => stockDe(p, s) > 0 && stockDe(p, s) <= 1)) return {cls: 'poco', txt: 'Poco stock'};
  return {cls: 'ok', txt: 'Con stock'};
}
/* Agrega al carrito sin pasar del stock ni del máximo. Devuelve cuántas unidades se agregaron. */
function addCart(id, size, qty){
  const p = prodById(id);
  const n = Math.min(qty, maxAgregable(p, size));
  if (n <= 0) return 0;
  let it = S.cart.find(i => i.id === id && i.size === size);
  if (!it) { it = {id, size, qty: 0}; S.cart.push(it); }
  it.qty += n;
  save();
  return n;
}
/* Búsqueda sin importar tildes ni mayúsculas ("pantalon" encuentra "Pantalón") */
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
/* Foto del producto. Si no hay o no carga, queda el color de fondo con un aviso. */
const pic = p => p.img
  ? `<img src="${p.img}" alt="${esc(p.name)}" loading="lazy" onerror="this.remove()">`
  : `<span class="nofoto">Foto pendiente</span>`;
const envioDe = (total, retiro) => (retiro || total >= ENVIO_GRATIS) ? 0 : COSTO_ENVIO;
/* Cupones de descuento de ejemplo */
const CUPONES = {
  URBANO10: {pct: 10, txt: '10% de descuento'},
  BIENVENIDA: {pct: 15, min: 20000, txt: '15% de descuento en compras desde $20.000'},
  ENVIOGRATIS: {envioGratis: true, txt: 'Envío gratis'}
};
/* Totales de la compra: subtotal, descuento del cupón, envío y total */
function totales(retiro){
  const sub = cartTotal();
  const c = CUPONES[S.cupon];
  const valido = !!c && (!c.min || sub >= c.min);
  const desc = valido && c.pct ? Math.round(sub * c.pct / 100) : 0;
  const envio = valido && c.envioGratis ? 0 : envioDe(sub - desc, retiro);
  return {sub, desc, envio, total: sub - desc + envio, valido, falta: c && c.min && !valido ? c.min - sub : 0};
}
function lineasTotales(t, retiro){

  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
const ORDENES = {'precio-asc':'Precio: menor a mayor', 'precio-desc':'Precio: mayor a menor', 'descuento':'Mayor descuento'};
function filtrar(qs){
  const tipo = qs.get('tipo'), oferta = qs.get('oferta');
  const talla = qs.get('talla'), max = Number(qs.get('max')) || 0, color = qs.get('color'), orden = qs.get('orden');
  /* Cada palabra buscada debe aparecer (en cualquier orden) */
  const palabras = norm(qs.get('q') || '').split(/\s+/).filter(Boolean);
  let list = visibles().filter(p =>
    (!tipo || p.tipo === tipo) &&
    (!palabras.length || palabras.every(w => norm(p.name + ' ' + p.tipo + ' ' + p.color + ' ' + p.marca).includes(w))) &&
    (!oferta || disc(p) > 0) &&
    (!talla || sizeOk(p, talla)) &&
    (!max || p.price <= max) &&
    (!color || p.color === color));
  if (orden === 'precio-asc') list.sort((a, b) => a.price - b.price);
  if (orden === 'precio-desc') list.sort((a, b) => b.price - a.price);
  if (orden === 'descuento') list.sort((a, b) => disc(b) - disc(a));
  /* Los agotados van al final (el orden entre ellos se mantiene) */
  list = list.filter(p => stockTotal(p) > 0).concat(list.filter(p => !stockTotal(p)));
  return list;
}

/* Sugerencias mientras se escribe en el buscador (sin redibujar la página) */
function sugerir(input){
  const box = document.getElementById('sugg');
  if (!box) return;
  const q = norm(input.value);
  if (q.length < 2) { box.hidden = true; input.setAttribute('aria-expanded', 'false'); return; }
  const palabras = q.split(/\s+/);
  const prods = visibles().filter(p => palabras.every(w => norm(p.name + ' ' + p.tipo + ' ' + p.color).includes(w))).slice(0, 5);
  const cats = CATS.filter(c => norm(c.t).includes(q)).slice(0, 2);
  box.innerHTML = cats.map(c => `<a role="option" href="#/catalogo?tipo=${enc(c.t)}">${svg('grid')}<span>Categoría: <b>${esc(c.t)}</b></span></a>`).join('')
    + prods.map(p => `<a role="option" href="#/producto?id=${p.id}"><span class="sthumb" style="background:${p.bg}">${pic(p)}</span><span>${esc(p.name)}<small>${fmt(p.price)}</small></span></a>`).join('')
    + (prods.length || cats.length ? `<a role="option" class="todos" href="#/catalogo?q=${enc(input.value.trim())}">Ver todos los resultados para “${esc(input.value.trim())}” →</a>`
       : `<p class="muted" style="margin:10px 12px">Sin coincidencias. Prueba con "vestido", "jeans" o "bolso".</p>`);
  box.hidden = false;
  input.setAttribute('aria-expanded', 'true');
}

/* Avance automático cada 6 segundos (se detiene con el mouse encima o si el usuario prefiere menos movimiento) */
let heroPausa = false;
const menosMovimiento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
document.addEventListener('mouseover', e => { heroPausa = !!(e.target.closest && e.target.closest('.hero')); });
document.addEventListener('focusin', e => { heroPausa = !!(e.target.closest && e.target.closest('.hero')); });
setInterval(() => {
  if (menosMovimiento || heroPausa || document.hidden || SLIDES.length < 2 || !document.querySelector('.hero')) return;
  slide = (slide + 1) % SLIDES.length;
  pintarHero();
}, 6000);

/* Foto ampliada del producto (se cierra con la X, tocando afuera o con Escape) */
function abrirFoto(){
  const p = prodById(pId);
  if (!p || !p.img || document.querySelector('.lightbox')) return;
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.setAttribute('role', 'dialog');
  lb.setAttribute('aria-modal', 'true');
  lb.setAttribute('aria-label', 'Foto de ' + p.name);
  lb.innerHTML = `<img src="${p.img}" alt="${esc(p.name)}"><button class="lb-close" data-act="cerrarFoto" aria-label="Cerrar foto">×</button>`;
  lb.addEventListener('click', e => { if (e.target === lb) cerrarFoto(); });
  document.body.appendChild(lb);
  document.body.style.overflow = 'hidden';
  lb.querySelector('.lb-close').focus();
}
function cerrarFoto(){
  const lb = document.querySelector('.lightbox');
  if (!lb) return;
  lb.remove();
  document.body.style.overflow = '';
  const img = document.querySelector('.pdp-img');
  if (img) img.focus();
}

function catalogPage(qs){

    <label>Ordenar por<select name="orden"><option value="">Relevancia</option>${Object.entries(ORDENES).map(([v, t]) => `<option value="${v}" ${orden === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
  </form>`;
  const sinResultados = `<div class="empty"><p>No encontramos productos con esos filtros.</p>

function productoPage(qs){

      <div class="pdp-info card">
        <span class="brand">${esc(p.marca)}</span>
        <h1>${esc(p.name)}</h1>
        <div class="muted">Color: ${esc(p.color)}</div>
        <div class="price-big">${fmt(p.price)}${p.old ? `<s>${fmt(p.old)}</s>` : ''}</div>
        <div class="muted">${d ? `Ahorras ${fmt(p.old - p.price)} · ` : ''}Impuestos incluidos</div>
        ${aviso}
        <h4 style="margin:18px 0 6px">${unica ? 'Talla única' : 'Talla' + (pSize ? ': ' + pSize : '')}</h4>
        ${unica ? '' : `<div class="sizes">${sizes}</div>
        <p class="muted" style="margin:6px 0 0">Las tallas tachadas están agotadas.</p>`}
        <div class="qtyrow">
          <span class="muted">Cantidad</span>
          <div class="qty"><button data-act="pqty" data-d="-1" aria-label="Menos" ${pQty <= 1 ? 'disabled' : ''}>−</button><span aria-live="polite">${pQty}</span><button data-act="pqty" data-d="1" aria-label="Más" ${pQty >= puede ? 'disabled' : ''}>+</button></div>
          ${enCarro ? `<span class="muted">Ya tienes ${enCarro} en el carrito</span>` : ''}
        </div>
        <div class="btnrow">
          <button class="btn" style="flex:1" data-act="agregarPdp" ${puede ? '' : 'disabled'}>${svg('cart')} ${textoBoton}</button>
          <button class="btn ghost" data-act="fav" data-id="${p.id}" aria-pressed="${fav}">${svg('heart')} ${fav ? 'En favoritos' : 'Favorito'}</button>
        </div>
        <button class="btn ghost full" style="margin-top:10px" data-act="comprarYa" ${puede || (pSize && enCarroDe(p.id, pSize)) ? '' : 'disabled'}>Comprar ahora</button>

        <div class="benefits" style="margin-top:16px">
          <div>${svg('truck')} Envío gratis desde $30.000 o retiro en tienda sin costo</div>
          <div>${svg('refresh')} Cambios y devoluciones en 30 días</div>
          <div>${svg('shield')} Compra segura y pagos protegidos</div>
        </div>
        <div class="details">
          <details open><summary>Descripción</summary><p>${DESC[p.tipo] || 'Prenda de la colección Tiendas Urbano.'}</p></details>
          <details><summary>Detalles y cuidado</summary><p>Color: ${esc(p.color)}<br>Marca: ${esc(p.marca)}<br>${unica ? 'Limpiar con un paño suave y seco.' : 'Lavar a máquina en agua fría, no usar secadora.'}<br>Consulta la etiqueta para ver la composición.</p></details>
          ${unica ? '' : `<details><summary>Guía de tallas</summary>${tablaTallas()}<p><a class="linkbtn" href="#/ayuda?t=tallas">Ver guía completa</a></p></details>`}

/* Reduce la foto para que quepa bien en el navegador */
function leerImagen(file, maxW, cb){
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, maxW / im.width);
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k);
      c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.85));
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}

  const p = prodById(id);

  p.stock[s] = n;

  if (input) { input.value = n; input.classList.toggle('cero', !n); }

  if (chip) { chip.className = 'chip-st ' + e.cls; chip.textContent = e.txt; }
  if (tot) tot.textContent = stockTotal(p) + ' en total';
  toast(`${p.name} · ${s === 'Única' ? '' : 'talla ' + s + ': '}${n} ${n === 1 ? 'unidad' : 'unidades'}`);
}

/* Cambiar estado; cancelar devuelve las unidades al inventario (y "des-cancelar" las vuelve a descontar) */
function cambiarEstado(id, nuevo){
  const o = S.orders.find(x => x.id === id);
  if (!o) return;
  const antes = o.estado || 'Recibido';
  if (antes === nuevo) return;
  const mover = signo => (o.items || []).forEach(it => {
    const p = it.id ? prodById(it.id) : PRODUCTS.find(x => x.name === it.nombre);
    if (p && sizesOf(p).includes(it.talla)) p.stock[it.talla] = Math.max(0, stockDe(p, it.talla) + signo * it.qty);
  });
  if (nuevo === 'Cancelado') mover(+1);
  if (antes === 'Cancelado') mover(-1);
  o.estado = nuevo;
  S.prods = PRODUCTS;
  if (!save()) toast(SIN_ESPACIO);
  else toast(nuevo === 'Cancelado' ? `Pedido ${id} cancelado: las unidades volvieron al inventario` : `Pedido ${id}: ${nuevo}`);
  render();
}

const PAGES = {inicio:homePage, catalogo:catalogPage, producto:productoPage, favoritos:favPage, carrito:cartPage, checkout:checkoutPage, login:loginPage, registro:registerPage, cuenta:accountPage, ayuda:infoPage, contacto:contactoPage};
const TITULOS = {inicio:'Moda que te inspira', catalogo:'Catálogo', favoritos:'Mis favoritos', carrito:'Tu carrito', checkout:'Pago', login:'Iniciar sesión', registro:'Crear cuenta', cuenta:'Mi cuenta', ayuda:'Ayuda', contacto:'Contacto', admin:'Panel del dueño'};
const APP = document.getElementById('app');
/* Adónde ir después de entrar o registrarse (solo páginas conocidas, para no redirigir a cualquier lado) */
const destino = qs => ({checkout:'#/checkout', cuenta:'#/cuenta', favoritos:'#/favoritos', carrito:'#/carrito'}[qs.get('next')] || '#/inicio');

function render(){
  const r = route();
  const path = r.path;
  if ((path === 'checkout' || path === 'cuenta') && !S.session) {
    location.hash = '#/login?next=' + path;
    return;
  }
  /* Si ya inició sesión, no tiene sentido mostrar el login o el registro */
  if ((path === 'login' || path === 'registro') && S.session) {
    location.replace(destino(r.qs));
    return;
  }
  if (path !== prevPath) {
    if (path === 'checkout') { cStep = 2; retiro = false; }
    if (path === 'contacto') contactoOk = false;
    loginErr = ''; regErr = ''; adminErr = '';
    prevPath = path;
  }
  /* Volver arriba solo al cambiar de página (no al elegir talla, filtrar o marcar favoritos) */
  const key = path + (path === 'producto' ? r.qs.get('id') : path === 'ayuda' ? r.qs.get('t') : '');
  const cambio = key !== prevKey;
  prevKey = key;
  const p = path === 'producto' ? prodById(Number(r.qs.get('id'))) : null;
  document.title = (p ? p.name : (TITULOS[path] || TITULOS.inicio)) + ' · Tiendas Urbano';
  if (ajustarCarrito()) toast('Actualizamos tu carrito: algunos productos ya no tienen stock suficiente');
  const lb = document.querySelector('.lightbox');   /* cerrar la foto ampliada al cambiar de página */
  if (lb && cambio) { lb.remove(); document.body.style.overflow = ''; }
  if (path === 'admin') {
    if (!S.admin) { APP.innerHTML = `<div class="authbg" style="width:100%">${adminLoginPage()}</div>`; return; }
    APP.innerHTML = `${header(path, r.qs)}<main class="wrap page">${adminPage()}</main>${footer}`;
    return;
  }
  const fn = PAGES[path] || homePage;
  if (path === 'login' || path === 'registro') {
    APP.innerHTML = `<div class="authbg" style="width:100%">${fn(r.qs)}</div>`;
  } else {
    APP.innerHTML = `${header(path, r.qs)}<main class="wrap page" id="contenido">${fn(r.qs)}</main>${footer}${bottomNav(path)}`;
  }
  if (cambio) window.scrollTo(0, 0);
}

/* Ajusta el carrito al stock real: quita lo borrado, oculto o agotado y baja cantidades que ya no alcanzan.
   Devuelve true si cambió algo. */
function ajustarCarrito(){
  let cambio = false;
  S.cart = S.cart.filter(i => {
    const p = prodById(i.id);
    const tope = p && !p.oculto ? Math.min(MAXQ, stockDe(p, i.size)) : 0;
    if (i.qty > tope) { cambio = true; i.qty = tope; }
    return i.qty > 0;
  });
  if (cambio) save();
  return cambio;
}
function pagar(){
  if (!S.cart.length) { render(); return; }   /* evita pedidos vacíos (doble clic, otra pestaña) */
  if (ajustarCarrito()) {                       /* el stock cambió mientras pagaba */
    toast('El stock cambió: revisa tu carrito antes de pagar');
    location.hash = '#/carrito';
    return;
  }
  const t = totales(retiro);
  const o = {
    id: 'UR-' + Math.floor(100000 + Math.random() * 900000),
    email: S.session,
    total: t.total,
    envio: t.envio,
    descuento: t.desc,
    cupon: t.valido ? S.cupon : '',
    retiro,
    metodo: pagoSel,
    fecha: new Date().toLocaleDateString('es-CL'),
    datos,
    estado: 'Recibido',
    items: S.cart.map(i => ({id: i.id, nombre: prodById(i.id).name, talla: i.size, qty: i.qty, precio: prodById(i.id).price}))
  };
  /* Descontar del stock lo vendido */
  S.cart.forEach(i => { const p = prodById(i.id); p.stock[i.size] = Math.max(0, stockDe(p, i.size) - i.qty); });
  S.prods = PRODUCTS;
  S.orders.unshift(o);
  S.cart = [];
  S.cupon = '';   /* el cupón se usa una vez por compra */
  save();
  cStep = 4;
  render();
  window.scrollTo(0, 0);
}
function findLine(el){
  const id = Number(el.dataset.id), size = el.dataset.size;
  return S.cart.find(i => i.id === id && i.size === size);
}

const ACT = {
  fav(el, id){
    const en = S.fav.includes(id);
    S.fav = en ? S.fav.filter(x => x !== id) : [...S.fav, id];
    save(); toast(en ? 'Quitado de favoritos' : 'Guardado en favoritos'); render();
  },
  clearfav(){ S.fav = []; save(); toast('Wishlist vaciada'); render(); },
  talla(el){
    const p = prodById(pId);
    if (!p || !sizeOk(p, el.dataset.s)) { toast('Esa talla está agotada'); return; }
    pSize = el.dataset.s; pAdded = false; render();
  },
  pqty(el){
    const p = prodById(pId);
    const tope = p && pSize ? Math.max(1, maxAgregable(p, pSize)) : 1;
    const nuevo = pQty + Number(el.dataset.d);
    if (nuevo > tope) { toast(`Solo hay ${tope} disponible${tope === 1 ? '' : 's'} para agregar en esta talla`); return; }
    pQty = Math.max(1, nuevo); render();
  },
  agregarPdp(){
    const p = prodById(pId);
    if (!p || !pSize) { toast('Elige una talla primero'); return; }
    const n = addCart(p.id, pSize, pQty);
    if (!n) toast(stockDe(p, pSize) ? 'Ya tienes en tu carrito todas las unidades disponibles de esta talla' : 'Esa talla está agotada');
    else if (n < pQty) toast(`Solo se agregaron ${n}: es lo que queda disponible`);
    else toast(`Agregado: ${p.name} · Talla ${pSize}`);
    pAdded = n > 0; pQty = 1;
    render();
  },
  comprarYa(){
    const p = prodById(pId);
    if (!p || !pSize) { toast('Elige una talla primero'); return; }
    if (!addCart(p.id, pSize, pQty) && !enCarroDe(p.id, pSize)) { toast('Esa talla está agotada'); return; }
    location.hash = '#/checkout';
  },
  qty(el){
    const it = findLine(el);
    if (!it) return;
    const d = Number(el.dataset.d);
    const tope = Math.min(MAXQ, stockDe(prodById(it.id), it.size));
    if (d > 0 && it.qty >= tope) { toast(tope >= MAXQ ? `El máximo es ${MAXQ} unidades por talla` : `Solo quedan ${tope} en stock de esta talla`); return; }
    it.qty += d;
    if (it.qty < 1) { S.cart = S.cart.filter(i => i !== it); toast('Producto eliminado del carrito'); }
    save(); render();
  },
  quitarCupon(){ S.cupon = ''; save(); toast('Cupón quitado'); render(); },
  saltar(){ const m = document.getElementById('contenido'); if (m) { m.setAttribute('tabindex', '-1'); m.focus(); } },
  arriba(){ window.scrollTo({top: 0, behavior: 'smooth'}); },
  social(el){ toast(`${el.dataset.red} de Tiendas Urbano (enlace simulado en el prototipo)`); },
  otroMensaje(){ contactoOk = false; render(); },
  rm(el){ S.cart = S.cart.filter(i => i !== findLine(el)); save(); toast('Producto eliminado'); render(); },
  slide(el){
    slide = 'd' in el.dataset
      ? (slide + Number(el.dataset.d) + SLIDES.length) % SLIDES.length
      : Number(el.dataset.n);
    pintarHero();
  },
  verFoto(){ abrirFoto(); },
  cerrarFoto(){ cerrarFoto(); },
  ver(el){
    const inp = el.parentElement.querySelector('input');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  },
  logout(){ S.session = null; save(); toast('Sesión cerrada'); location.hash = '#/inicio'; render(); },
  olvide(){ toast('Simulado: en el prototipo no se envían correos.'); },
  adTab(el){ AD.tab = el.dataset.t; AD.edit = null; render(); },
  adIr(el){ AD.tab = el.dataset.t; AD.edit = null; AD.filtro = el.dataset.f || 'todos'; render(); window.scrollTo(0, 0); },
  adFiltro(el){ AD.filtro = el.dataset.f; render(); },
  adOcultar(el, id){
    const p = prodById(id);
    if (!p) return;
    p.oculto = !p.oculto;
    guardarProductos();
    toast(p.oculto ? `"${p.name}" ya no se muestra en la tienda` : `"${p.name}" vuelve a estar a la venta`);
    render();
  },
  stCambia(el, id){ const p = prodById(id); if (p) cambiarStock(id, el.dataset.s, stockDe(p, el.dataset.s) + Number(el.dataset.d)); },
  adNuevo(){ AD.edit = 'nuevo'; fotoNueva = null; render(); },
  adEditar(el, id){ AD.edit = id; fotoNueva = null; render(); },
  adCancelar(){ AD.edit = null; fotoNueva = null; render(); },
  adBorrar(el, id){
    const p = prodById(id);
    if (!p || !confirm(`¿Borrar "${p.name}"? No se puede deshacer.`)) return;
    PRODUCTS = PRODUCTS.filter(x => x.id !== id);
    guardarProductos(); toast('Producto borrado'); render();
  },
  adSalir(){ S.admin = false; save(); location.hash = '#/inicio'; render(); },
  adRestaurar(){
    if (!confirm('¿Volver a los productos y banners originales? Se perderán tus cambios.')) return;
    S.prods = null; S.slides = null; save();
    PRODUCTS = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
    PRODUCTS.forEach(prepararStock);
    SLIDES = JSON.parse(JSON.stringify(DEFAULT_SLIDES));
    toast('Tienda restaurada'); render();
  },
  volverCarrito(){ location.hash = '#/carrito'; },
  volverDatos(){ cStep = 2; render(); },
  pagar(){ pagar(); },
  seguir(){ cStep = 2; location.hash = '#/inicio'; render(); }
};

/* Buscador: sugerencias, flechas del teclado y Escape */
document.addEventListener('input', e => {
  if (e.target.closest && e.target.closest('#fSearch')) sugerir(e.target);
  /* Panel del dueño: filtrar la lista de productos sin redibujar */
  if (e.target.id === 'adBuscar') {
    const q = norm(e.target.value);
    let n = 0;
    document.querySelectorAll('.arow').forEach(r => { const ver = !q || norm(r.dataset.buscar).includes(q); r.hidden = !ver; n += ver; });
    const c = document.getElementById('adCuenta'); if (c) c.textContent = `${n} productos`;
  }
});
document.addEventListener('keydown', e => {
  /* Elementos que actúan como botón (ej. la foto del producto) también responden a Enter y Espacio */
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role=button][data-act]')) {
    e.preventDefault(); e.target.click(); return;
  }
  const box = document.getElementById('sugg');
  if (e.key === 'Escape') {
    if (box && !box.hidden) { box.hidden = true; document.querySelector('#fSearch input').focus(); }
    cerrarFoto();
    return;
  }
  if (!box || box.hidden || !e.target.closest('#fSearch')) return;
  const ops = [...box.querySelectorAll('a')];
  if (!ops.length || (e.key !== 'ArrowDown' && e.key !== 'ArrowUp')) return;
  e.preventDefault();
  const i = ops.indexOf(document.activeElement);
  const j = e.key === 'ArrowDown' ? (i + 1) % ops.length : (i <= 0 ? ops.length - 1 : i - 1);
  ops[j].focus();
});
document.addEventListener('focusout', e => {
  if (!e.target.closest || !e.target.closest('#fSearch')) return;
  setTimeout(() => {
    const box = document.getElementById('sugg');
    if (box && !document.getElementById('fSearch').contains(document.activeElement)) box.hidden = true;
  }, 150);
});

/* Si se abre la tienda en dos pestañas, mantener carrito, favoritos y sesión iguales */

  S.users ||= []; S.cart ||= []; S.fav ||= []; S.orders ||= []; S.session ??= null; S.admin ??= false;

});

/* Foto arrastrada desde el escritorio: no dejar que el navegador abra el archivo */
function aplicarFoto(zone, file){
  if (!zone || !file) return;
  if (!file.type.startsWith('image/')) { toast('Solo se aceptan imágenes (JPG, PNG, WEBP)'); return; }
  if (zone.dataset.kind === 'prod') {
    leerImagen(file, 900, url => {
      fotoNueva = url;
      zone.querySelector('.prev').innerHTML = `<img src="${url}" alt="">`;
      toast('Foto cargada. Recuerda guardar.');
    });
  } else {
    const i = Number(zone.dataset.i);
    leerImagen(file, 1400, url => {
      slideFotos[i] = url;
      zone.querySelector('.prev').innerHTML = `<img src="${url}" alt="">`;
      toast('Foto cargada. Recuerda guardar los banners.');
    });
  }
}
document.addEventListener('dragover', e => {
  e.preventDefault();
  const z = e.target.closest && e.target.closest('.dropzone');
  document.querySelectorAll('.dropzone.over').forEach(x => { if (x !== z) x.classList.remove('over'); });
  if (z) z.classList.add('over');
});
document.addEventListener('dragleave', e => {
  const z = e.target.closest && e.target.closest('.dropzone');
  if (z && !z.contains(e.relatedTarget)) z.classList.remove('over');
});
document.addEventListener('drop', e => {
  e.preventDefault();
  const z = e.target.closest && e.target.closest('.dropzone');
  document.querySelectorAll('.dropzone.over').forEach(x => x.classList.remove('over'));
  if (z) aplicarFoto(z, e.dataTransfer.files[0]);
});

document.addEventListener('change', e => {
  /* Foto elegida con el selector de archivos */
  if (e.target.classList.contains('dz-input') && e.target.files[0]) {
    aplicarFoto(e.target.closest('.dropzone'), e.target.files[0]);
    return;
  }
  if (e.target.name === 'pago') { pagoSel = e.target.value; return; }
  if (e.target.dataset && e.target.dataset.stock) { cambiarStock(Number(e.target.dataset.stock), e.target.dataset.s, e.target.value); return; }
  if (e.target.dataset && e.target.dataset.estado) { cambiarEstado(e.target.dataset.estado, e.target.value); return; }
  if (e.target.name === 'tipo' && e.target.form && e.target.form.id === 'fProducto') {
    const unica = e.target.value === 'Accesorios';
    e.target.form.querySelector('.st-ropa').hidden = unica;
    e.target.form.querySelector('.st-unica').hidden = !unica;
    return;
  }
  /* Domicilio o retiro: guarda lo ya escrito antes de redibujar */
  if (e.target.name === 'entrega') {
    const f = e.target.form;
    ['nombre', 'tel', 'dir', 'comuna'].forEach(k => { if (f[k]) datos[k] = f[k].value; });
    retiro = e.target.value === 'retiro';
    render();
    return;
  }
  /* Filtros del catálogo: al cambiar cualquiera se actualiza la URL */
  if (e.target.form && e.target.form.id === 'fFiltros') {
    const fd = new FormData(e.target.form);
    const p = new URLSearchParams();
    for (const [k, v] of fd.entries()) if (v) p.set(k, v);
    const s = p.toString();
    location.hash = '#/catalogo' + (s ? '?' + s : '');
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  const d = Object.fromEntries(new FormData(f));

  if (f.id === 'fAdminLogin') {
    if (d.email === DUENO.email && d.pass === DUENO.pass) {
      S.admin = true; save(); adminErr = ''; AD = {tab: 'resumen', edit: null, filtro: 'todos'};
      toast('Bienvenido al panel'); render();
    } else { adminErr = 'Correo o contraseña incorrectos.'; render(); }
    return;
  }

  if (f.id === 'fProducto') {
    const price = Math.round(Number(d.price)), old = Math.round(Number(d.old) || 0);
    const errP = document.getElementById('errProd');
    if (!d.name || !d.name.trim()) { errP.textContent = 'Escribe el nombre del producto.'; f.name.focus(); return; }
    if (!(price > 0)) { errP.textContent = 'Escribe un precio de venta mayor que cero.'; f.price.focus(); return; }
    if (old && old <= price) { errP.textContent = 'Para que sea oferta, el precio anterior debe ser MAYOR que el precio de venta. Si no hay oferta, déjalo vacío.'; f.old.focus(); return; }
    const cat = CATALOGO.find(c => c.tipo === d.tipo);
    const base = {
      name: d.name.trim(), tipo: d.tipo, color: (d.color || '').trim() || 'Único', marca: d.marca,
      price, old: old > price ? old : 0, destacado: !!d.destacado, oculto: !!d.oculto, bg: cat ? cat.bg : '#eee'
    };
    /* Stock según las tallas de la categoría elegida */
    const stock = {};
    sizesOf(base).forEach(s => { stock[s] = Math.max(0, Math.min(999, Math.floor(Number(d['st_' + s]) || 0))); });
    base.stock = stock;
    const sinStock = !Object.values(stock).some(Boolean);
    let msg;
    if (AD.edit === 'nuevo') {
      const id = Math.max(0, ...PRODUCTS.map(p => p.id)) + 1;
      PRODUCTS.push({id, ...base, img: fotoNueva || ''});
      msg = 'Producto subido a la tienda';
    } else {
      const p = prodById(AD.edit);
      Object.assign(p, base);
      if (fotoNueva) p.img = fotoNueva;
      msg = 'Cambios guardados';
    }
    toast(sinStock ? msg + '. Ojo: no tiene stock, se verá como agotado' : base.oculto ? msg + ' (oculto en la tienda)' : msg);
    fotoNueva = null; AD.edit = null;
    guardarProductos(); render(); window.scrollTo(0, 0);
    return;
  }

  if (f.id === 'fBanners') {
    SLIDES = SLIDES.map((s, i) => ({
      t1: d[`t1_${i}`] || s.t1, t2: d[`t2_${i}`] || '', cta: d[`cta_${i}`] || 'Ver más',
      href: d[`href_${i}`] || 'catalogo', img: slideFotos[i] || s.img
    }));
    slideFotos = {};
    guardarBanners(); toast('Banners guardados'); render();
    return;
  }

  if (f.id === 'fSearch') {
    location.hash = '#/catalogo?q=' + enc((d.q || '').trim());
    return;
  }

  if (f.id === 'fCupon') {
    const code = (d.codigo || '').trim().toUpperCase().replace(/\s+/g, '');
    const err = f.parentElement.querySelector('#errCupon');
    if (!code) { err.textContent = 'Escribe un código.'; return; }
    if (!CUPONES[code]) { err.textContent = 'Ese código no existe o ya expiró.'; return; }
    S.cupon = code; save();
    const t = totales(false);
    toast(t.valido ? `Cupón ${code} aplicado` : `Cupón guardado: te faltan ${fmt(t.falta)} para usarlo`);
    render();
    return;
  }

  if (f.id === 'fNews') {
    const email = (d.email || '').trim().toLowerCase();
    if (!emailOk(email)) { toast('Ingresa un correo válido'); return; }
    S.news ||= [];
    if (S.news.includes(email)) toast('Ese correo ya está suscrito. ¡Gracias!');
    else { S.news.push(email); save(); toast('¡Gracias! Te suscribiste a las ofertas (simulado).'); }
    f.reset();
    return;
  }

  if (f.id === 'fContacto') {
    const err = f.querySelector('#errContacto');
    if ((d.nombre || '').trim().length < 2) { err.textContent = 'Escribe tu nombre.'; f.nombre.focus(); return; }
    if (!emailOk((d.email || '').trim())) { err.textContent = 'Escribe un correo válido.'; f.email.focus(); return; }
    if ((d.mensaje || '').trim().length < 5) { err.textContent = 'Escribe tu mensaje.'; f.mensaje.focus(); return; }
    S.mensajes ||= [];
    S.mensajes.push({nombre: d.nombre.trim(), email: d.email.trim(), motivo: d.motivo, mensaje: d.mensaje.trim(), fecha: new Date().toLocaleString('es-CL')});
    save();
    contactoOk = true; render();
    return;
  }

  if (f.id === 'fLogin') {
    const email = (d.email || '').trim().toLowerCase();
    if (!email || !d.pass) { loginErr = 'Escribe tu email y tu contraseña.'; render(); return; }
    const user = S.users.find(u => u.email === email && u.pass === d.pass);
    if (!user) {
      loginErr = S.users.some(u => u.email === email) ? 'La contraseña no es correcta.' : 'No existe una cuenta con ese email. Puedes crear una.';
      render(); return;
    }
    S.session = user.email; save();
    toast('¡Bienvenida a Tiendas Urbano!');
    location.hash = destino(route().qs);
    return;
  }

  if (f.id === 'fRegistro') {
    const email = (d.email || '').trim().toLowerCase();
    regErr = '';   /* borrar el error anterior: si no, el formulario queda bloqueado tras un error */
    if (!emailOk(email)) regErr = 'Ingresa un email válido.';
    else if ((d.pass || '').length < 4) regErr = 'La contraseña debe tener al menos 4 caracteres.';
    else if (!d.terms) regErr = 'Debes aceptar los términos y condiciones.';
    else if (S.users.some(u => u.email === email)) regErr = 'Ya existe una cuenta con ese email.';
    if (regErr) { render(); return; }
    S.users.push({email, pass: d.pass});
    S.session = email; save();
    toast('¡Cuenta creada! Bienvenida a Tiendas Urbano');
    location.hash = destino(route().qs);
    return;
  }

  if (f.id === 'fDatos') {
    const v = k => (d[k] || '').trim();
    const err = f.querySelector('#errDatos');
    const digitos = v('tel').replace(/\D/g, '');
    if (v('nombre').length < 3) { err.textContent = 'Escribe tu nombre completo.'; f.nombre.focus(); return; }
    if (digitos.length < 8 || digitos.length > 12) { err.textContent = 'Escribe un teléfono válido (ej: +56 9 1234 5678).'; f.tel.focus(); return; }
    if (!retiro && v('dir').length < 5) { err.textContent = 'Escribe tu dirección (calle y número).'; f.dir.focus(); return; }
    if (!retiro && v('comuna').length < 3) { err.textContent = 'Escribe tu comuna.'; f.comuna.focus(); return; }
    datos = {nombre: v('nombre'), tel: v('tel'), dir: retiro ? '' : v('dir'), comuna: retiro ? '' : v('comuna')};
    cStep = 3; render(); window.scrollTo(0, 0);
    return;
  }
});

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
